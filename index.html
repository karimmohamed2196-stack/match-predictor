<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>متوقع المباريات PRO</title>
<style>:root{--bg:#070b1a;--card:#101831;--c2:#18223f;--bd:#243152;--tx:#eef3ff;--mut:#8e9bbd;--gold:#38bdf8;--g:#22c55e;--r:#ef4444;--n:#5b6b85;--rad:16px;--sh:0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
:root[data-theme=light]{--bg:#f3f5fa;--card:#fff;--c2:#eef1f8;--bd:#dbe1ee;--tx:#141c2e;--mut:#56627a;--gold:#0369a1;--g:#16a34a;--r:#dc2626;--n:#7b889f;--sh:0 6px 18px rgba(27,42,74,.10);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;color:var(--tx);font-family:"Segoe UI",system-ui,-apple-system,Tahoma,"Noto Naskh Arabic",sans-serif;line-height:1.5;font-variant-numeric:tabular-nums;padding:env(safe-area-inset-top) 0 calc(100px + env(safe-area-inset-bottom));background:radial-gradient(900px 420px at 50% -140px,rgba(37,99,235,.38),transparent),var(--bg);min-height:100vh}
:root[data-theme=light] body{background:radial-gradient(900px 420px at 50% -140px,#d6e8ff,transparent),var(--bg)}
button,.m,.tab,.ib,.fav,summary{touch-action:manipulation}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* header */
header{max-width:640px;margin:0 auto;padding:14px 14px 4px}
h1{display:flex;align-items:center;gap:8px;margin:0;font-size:20px;font-weight:800;letter-spacing:.2px}
h1 em{font-style:normal;background:linear-gradient(135deg,#67e8f9,#0ea5e9);color:#031321;border-radius:7px;padding:1px 8px;font-size:11px;font-weight:800}
#ln,#tg,#hp{height:38px;min-width:38px;display:inline-flex;align-items:center;justify-content:center;font:inherit;font-size:14px;font-weight:700;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:0 12px;color:var(--tx);cursor:pointer;transition:.15s}
#ln{margin-inline-start:auto}#tg{margin-inline-start:0}
#ln:active,#tg:active,#hp:active{transform:scale(.94)}
.sub{margin:2px 0 12px;font-size:12px;color:var(--mut)}
.tb{display:flex;gap:8px;margin-bottom:6px}
#q{flex:1;min-width:0;font:inherit;font-size:15px;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:0 14px;height:44px;margin:0}
#q::placeholder{color:var(--mut)}
#q:focus{border-color:var(--gold);outline:0;box-shadow:0 0 0 3px rgba(56,189,248,.18)}
#so{flex:none;width:auto;max-width:44%;height:44px;margin:0;padding:0 10px;font-size:13px;direction:rtl;text-align:start;border-radius:12px;background:var(--card)}

/* tabs */
#tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;margin:0 auto;max-width:640px;scrollbar-width:none;scroll-snap-type:x proximity;background:linear-gradient(var(--bg) 70%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%)}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;scroll-snap-align:center;min-height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--mut);font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.18s;white-space:nowrap}
.tab:active{transform:scale(.95)}
.tab.on{border-color:var(--gold);background:rgba(56,189,248,.12);color:var(--gold);font-weight:800;box-shadow:0 4px 14px rgba(56,189,248,.18)}
:root[data-theme=light] .tab.on{background:#dff3ff}

main{max-width:640px;margin:0 auto;padding:4px 14px 12px}

/* day heading */
.day{display:flex;align-items:center;gap:10px;margin:20px 2px 10px;font-size:13px;font-weight:800;color:var(--gold);letter-spacing:.2px}
.day:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--bd),transparent)}

/* match card */
.m{position:relative;margin-bottom:12px;border:1px solid var(--bd);border-radius:var(--rad);overflow:hidden;background:linear-gradient(180deg,var(--card),color-mix(in srgb,var(--card) 88%,#000));box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s;animation:fi .35s ease both}
:root[data-theme=light] .m{background:var(--card)}
.m.open{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 14px 34px rgba(56,189,248,.14)}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.fav{position:absolute;top:2px;inset-inline-start:2px;z-index:2;padding:8px 10px;font-size:22px;line-height:1;color:var(--gold);cursor:pointer;opacity:.9;transition:transform .15s}
.fav:active{transform:scale(1.3)}
.mt{display:grid;grid-template-columns:1fr 74px 1fr;align-items:start;gap:4px;padding:16px 8px 12px;cursor:pointer;direction:ltr}
.tm{text-align:center;font-size:13.5px;font-weight:700;line-height:1.3;word-break:break-word}
.lg{width:52px;height:52px;border-radius:50%;margin:0 auto 7px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.12)}
.lg img{width:42px;height:42px;object-fit:contain}
.mid{align-self:center;text-align:center;color:var(--tx);font-size:13px;font-weight:700;margin-top:4px}
.mid b{display:block;margin-top:6px;color:var(--gold);font-size:11px;letter-spacing:2px}
.inj{display:block;width:max-content;max-width:100%;margin:6px auto 0;padding:2px 9px;font-size:11px;font-weight:600;color:#fca5a5;background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.25);border-radius:999px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
:root[data-theme=light] .inj{color:#b91c1c;background:#fee2e2}

/* probability bar */
.pb{display:flex;height:20px;margin:0 14px 12px;border-radius:10px;overflow:hidden;gap:2px;direction:ltr}
.pb i{display:flex;align-items:center;justify-content:center;height:100%;font-style:normal;font-size:10.5px;font-weight:800;color:#fff;min-width:0;transition:width .4s}

/* odds */
.od{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:0 12px 14px;direction:ltr;cursor:pointer}
.od div{background:var(--c2);border:1px solid var(--bd);border-radius:12px;text-align:center;padding:7px 0 6px;font-size:11px;font-weight:700;color:var(--mut);transition:.15s}
.od b{display:block;margin-top:1px;color:var(--tx);font-size:17px;font-weight:800;line-height:1.2}
.od small{display:block;font-size:10.5px;font-weight:600;color:var(--mut)}
.od div.pk{border-color:var(--g);background:color-mix(in srgb,var(--g) 14%,var(--c2))}
.od div.pk b{color:var(--g)}
.od div.pk small{color:var(--g)}

/* details */
.det{display:none;padding:14px;border-top:1px solid var(--bd);background:rgba(0,0,0,.14);cursor:default}
:root[data-theme=light] .det{background:#f8f9fd}
.m.open .det{display:block;animation:fi .25s ease both}
.bar{display:flex;height:36px;margin-bottom:12px;border-radius:11px;overflow:hidden;direction:ltr;gap:2px}
.bar div{display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:#fff}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;font-size:14px;border-bottom:1px dashed var(--bd)}
.kv:last-child{border-bottom:0}
.kv b{font-weight:700;text-align:end}
.gt{margin:18px 0 8px;padding-inline-start:9px;border-inline-start:3px solid var(--gold);color:var(--gold);font-size:13.5px;font-weight:800}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:7px;direction:ltr}
.c{padding:9px 4px;text-align:center;background:var(--c2);border:1px solid var(--bd);border-radius:12px}
.c small{display:block;margin-bottom:2px;font-size:11px;line-height:1.25;color:var(--mut)}
.c b{display:block;font-size:18px;font-weight:800}
.c i{display:block;font-style:normal;font-size:12px;font-weight:600;color:var(--g)}
.c .ri{margin-top:4px;font-size:12px;padding:5px 2px}.c .ed{font-weight:700}
.cm{font-size:12px;color:var(--mut);margin:4px 0}

/* collapsibles */
details{margin-top:14px}
summary{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;list-style:none;padding:11px 14px;font-size:14px;font-weight:800;color:var(--gold);background:var(--c2);border:1px solid var(--bd);border-radius:12px;min-height:44px}
summary::-webkit-details-marker{display:none}
summary:after{content:"▾";font-size:13px;transition:transform .2s}
details[open]>summary{margin-bottom:6px}
details[open]>summary:after{transform:rotate(180deg)}
ul{padding-inline-start:20px;margin:6px 0;font-size:13px;line-height:1.7}

/* chips & misc */
.f{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin:0 1px;border-radius:6px;font-size:11px;font-weight:800;color:#fff}
.fW{background:var(--g)}.fD{background:var(--n)}.fL{background:var(--r)}
.mut{color:var(--mut);font-size:12.5px;line-height:1.65}
.card{margin-top:18px;padding:14px;background:var(--card);border:1px solid var(--bd);border-radius:var(--rad);box-shadow:var(--sh)}
details.card{padding:0;background:transparent;border:0;box-shadow:none}
details.card>summary{background:var(--card);box-shadow:var(--sh)}
details.card[open]>summary{margin-bottom:0;border-end-start-radius:0;border-end-end-radius:0}
details.card>*:not(summary){margin-inline:0}
select,button.go{width:100%;min-height:46px;margin-top:8px;padding:0 12px;font:inherit;font-size:14px;color:var(--tx);background:var(--c2);border:1px solid var(--bd);border-radius:12px;direction:ltr;text-align:left}
select:focus{border-color:var(--gold);outline:0}
button.go{background:linear-gradient(135deg,#67e8f9,#0ea5e9);color:#031321;border:0;font-weight:800;text-align:center;cursor:pointer;box-shadow:0 6px 16px rgba(14,165,233,.3)}
button.go:active{transform:scale(.98)}
label.ck{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px;min-height:40px}
label.ck input{width:20px;height:20px;accent-color:var(--gold)}
#cust{background:var(--card);border:1px solid var(--bd);border-radius:var(--rad);padding:0 0 14px;overflow:hidden}
#cust>summary{border:0;border-radius:0}
#cust>*:not(summary){margin-inline:14px;width:calc(100% - 28px)}
#cust>#cres{width:auto}

.ib{min-height:40px;margin:3px;padding:8px 13px;font:inherit;font-size:12.5px;font-weight:600;color:var(--tx);background:var(--c2);border:1px solid var(--bd);border-radius:10px;cursor:pointer;transition:.15s}
.ib:active{transform:scale(.95)}
.ib.on{border-color:var(--gold);color:var(--gold);background:rgba(56,189,248,.1)}
.sh{min-height:40px;margin-bottom:6px;padding:8px 12px;font:inherit;font-size:12.5px;color:var(--tx);background:var(--c2);border:1px solid var(--bd);border-radius:10px}
.ri,.rr{width:100%;padding:9px;font:inherit;font-size:14px;color:var(--tx);text-align:center;direction:ltr;background:var(--c2);border:1px solid var(--bd);border-radius:10px}
.rr{margin-top:8px}
.ri:focus,.rr:focus{border-color:var(--gold);outline:0}
.vr{display:grid;grid-template-columns:44px 1fr 1fr 1fr 1fr;gap:4px;padding:4px 0;font-size:12px;text-align:center;direction:ltr}
.vr.v{color:var(--g);font-weight:700}
.hr{display:grid;grid-template-columns:24px 62px 1fr 44px 1fr;gap:4px;align-items:center;padding:6px 0;font-size:12px;border-bottom:1px solid var(--bd);direction:ltr}
.hr .t1,.hr .t2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hr .t1{text-align:right}.hr .t2{text-align:left}.hr .s{text-align:center}
.lr{margin-bottom:10px;padding:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px}
.ad{margin-bottom:10px;padding:20px;text-align:center;font-size:12px;color:var(--mut);border:1px dashed var(--bd);border-radius:14px}

/* tables */
.card table{border-collapse:collapse}
.card table td{padding:8px 4px;white-space:nowrap}
.card table tr:not(.mut):nth-child(even){background:rgba(127,140,170,.07)}
.card table tr:not(.mut) td:first-child{color:var(--mut)}
.card table tr:not(.mut):nth-child(-n+5) td:first-child{color:var(--gold);font-weight:800}

main>p.mut{margin-top:22px;padding-top:14px;border-top:1px solid var(--bd);line-height:1.8;font-size:12px}
#bt .card{margin-top:14px}

/* age gate */
#ag{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(4,7,12,.9);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#ag>div{width:100%;max-width:340px;padding:24px 20px;text-align:center;background:var(--card);border:1px solid var(--gold);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#ag h2{margin:0 0 8px;font-size:34px;font-weight:900;color:var(--gold)}
#ag p{margin:0 0 6px;color:var(--mut);font-size:14px}

@media(min-width:700px){header,main,#tabs,#stk{max-width:720px}.m:hover{border-color:color-mix(in srgb,var(--gold) 55%,var(--bd))}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

/* hero */
.hero{position:relative;overflow:hidden;margin-bottom:14px;padding:14px 14px 16px;border-radius:20px;border:1px solid rgba(56,189,248,.35);background:radial-gradient(420px 220px at 85% -20%,rgba(56,189,248,.35),transparent),radial-gradient(360px 200px at 0% 120%,rgba(99,102,241,.35),transparent),linear-gradient(160deg,#122046,#0a1230);box-shadow:0 14px 36px rgba(14,165,233,.18);color:#eef3ff;animation:fi .4s ease both}
.hero:before{content:"";position:absolute;inset:0;opacity:.07;background:repeating-linear-gradient(90deg,#fff 0 1px,transparent 1px 44px);pointer-events:none}
.hk{position:relative;display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:13px;font-weight:800;color:#7dd3fc}
.hk span{padding:2px 10px;font-size:11px;font-weight:700;color:#cbd5e1;background:rgba(255,255,255,.09);border-radius:999px}
.hm{position:relative;display:grid;grid-template-columns:1fr 96px 1fr;align-items:center;direction:ltr;margin:8px 0 14px}
.hm .tm{text-align:center;font-size:14px;font-weight:800}
.hm .lg{width:66px;height:66px}.hm .lg img{width:54px;height:54px}
.hc{text-align:center}.hc b{display:block;font-size:28px;font-weight:900;color:#fff;letter-spacing:.5px}.hc small{display:block;font-size:11.5px;color:#a9b8d8}
.hero .pb{position:relative;margin:0 0 4px}
.hero button.go.hb{position:relative;margin-top:12px}

/* bottom nav */
#bn{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;max-width:720px;margin:0 auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--bd);border-radius:20px 20px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.35)}
#bn button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:52px;padding:4px 0;font:inherit;font-size:11px;font-weight:700;color:var(--mut);background:none;border:0;border-radius:14px;cursor:pointer;transition:.15s}
#bn button span{font-size:20px;line-height:1.2;filter:grayscale(1) opacity(.7);transition:.15s}
#bn button.on{color:var(--gold)}
#bn button.on span{filter:none;transform:translateY(-2px)}
#bn button.on:after{content:"";width:18px;height:3px;margin-top:2px;background:var(--gold);border-radius:3px}

.sh2{margin:10px 0 4px;font-size:13px;font-weight:700}
.sg{padding:10px 12px 8px;background:var(--c2);border:1px solid var(--bd);border-radius:14px}
.sr{display:grid;grid-template-columns:104px 1fr 56px;align-items:center;gap:8px;padding:5px 0}
.sn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:700}
.sb{height:10px;background:rgba(127,140,170,.2);border-radius:6px;overflow:hidden;direction:ltr}
.sb i{display:block;height:100%;border-radius:6px}
.rk{text-align:left;white-space:nowrap}.rk b{font-size:17px;font-weight:900}.rk small{font-size:11px;color:var(--mut)}

#stk{position:sticky;top:0;z-index:20;max-width:640px;margin:0 auto}
#stale{margin:8px 14px 0;padding:9px 12px;font-size:12.5px;font-weight:700;line-height:1.6;color:#fde68a;background:rgba(245,158,11,.16);border:1px solid rgba(245,158,11,.42);border-radius:12px}
:root[data-theme=light] #stale{color:#92400e;background:#fef3c7}
.sk{height:210px;margin-bottom:12px;border-radius:16px;border:1px solid var(--bd);background:linear-gradient(100deg,var(--card) 30%,var(--c2) 50%,var(--card) 70%);background-size:300% 100%;animation:shm 1.3s linear infinite}
@keyframes shm{to{background-position:-300% 0}}
.pb i{opacity:.55;transition:opacity .2s}.pb i.mx{opacity:1;box-shadow:0 0 12px rgba(255,255,255,.2)}
.pb.big{height:28px;margin:0 0 8px;border-radius:12px}.pb.big i{font-size:12px}
.c.hi{border-color:var(--g);background:color-mix(in srgb,var(--g) 14%,var(--c2))}.c.hi b{color:var(--g)}
.sm{padding:0 14px 8px;text-align:center;font-size:13.5px;font-weight:700;line-height:1.6}.sm em{font-style:normal;color:var(--gold)}
.bdg{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:0 12px 12px}
.bd{padding:3px 10px;font-size:11.5px;font-weight:700;color:var(--mut);background:var(--c2);border:1px solid var(--bd);border-radius:999px}
.bd.ok{color:var(--g);border-color:color-mix(in srgb,var(--g) 55%,var(--bd));background:color-mix(in srgb,var(--g) 12%,var(--c2))}
.bd.mid{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 50%,var(--bd))}
.bd.low{color:#f59e0b;border-color:rgba(245,158,11,.5);background:rgba(245,158,11,.1)}
.lgd{display:flex;justify-content:space-between;gap:6px;margin-bottom:12px;font-size:11.5px;color:var(--mut)}
.lgd i{display:inline-block;width:9px;height:9px;margin-inline-end:4px;border-radius:3px}
.act{display:flex;gap:8px;margin-top:12px}
.abtn{flex:1;min-height:44px;font:inherit;font-size:13px;font-weight:700;color:var(--tx);background:var(--c2);border:1px solid var(--bd);border-radius:12px;cursor:pointer}
.abtn:active{transform:scale(.97)}
.acc{margin:0 0 12px;padding:9px 12px;font-size:12.5px;line-height:1.7;color:var(--mut);background:var(--card);border:1px solid var(--bd);border-radius:12px}.acc b{color:var(--gold);font-size:14px}
#ob{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(4,7,12,.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#ob>div{width:100%;max-width:340px;padding:24px 20px;text-align:center;background:var(--card);border:1px solid var(--gold);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.obi{font-size:44px}#ob h2{margin:6px 0 8px;color:var(--gold);font-size:20px}#ob p{margin:0 0 14px;font-size:14px;line-height:1.9;color:var(--mut)}#ob p b{font-weight:800}
.obd{display:flex;justify-content:center;gap:6px;margin-bottom:8px}.obd i{width:8px;height:8px;border-radius:50%;background:var(--bd);transition:.2s}.obd i.on{width:22px;background:var(--gold);border-radius:6px}
.obs{background:transparent!important;color:var(--mut)!important;box-shadow:none!important}
#ts{position:fixed;left:50%;bottom:92px;z-index:60;max-width:88%;padding:10px 16px;font-size:13px;font-weight:700;color:var(--tx);background:var(--card);border:1px solid var(--gold);border-radius:999px;box-shadow:var(--sh);opacity:0;pointer-events:none;transform:translate(-50%,20px);transition:.25s}
#ts.show{opacity:1;transform:translate(-50%,0)}
#up{position:fixed;inset-inline-end:14px;bottom:88px;z-index:45;width:44px;height:44px;font-size:20px;color:var(--gold);background:var(--card);border:1px solid var(--bd);border-radius:50%;box-shadow:var(--sh);cursor:pointer}
#ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);z-index:70;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--gold);background:var(--card);border:1px solid var(--gold);border-radius:50%;opacity:0;pointer-events:none;transform:translate(-50%,-40px)}
